name: CI - Build e Testes Automatizados

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências (Build)
        run: npm ci

      - name: Executar testes unitários e de integração
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx jest --coverage --forceExit