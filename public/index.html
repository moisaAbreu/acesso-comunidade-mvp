<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AcessoComunidade - Inscrição</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    .btn-acessivel { min-height: 44px; font-size: 1.1rem; }
  </style>
</head>
<body class="bg-light">
  <div class="container py-4" style="max-width: 480px;">
    
    <!-- Cabeçalho -->
    <div class="text-center mb-4">
      <h2 class="fw-bold text-success">AcessoComunidade</h2>
      <p class="text-muted">Retiro de Jovens 2026</p>
    </div>

    <!-- Formulário de Inscrição -->
    <div id="form-container" class="card shadow-sm p-4 rounded-3">
      <form id="form-inscricao">
        <div class="mb-3">
          <label for="nome" class="form-label fw-bold">Nome Completo</label>
          <input type="text" id="nome" class="form-control form-control-lg" required placeholder="Ex: João Silva">
        </div>

        <div class="mb-3">
          <label for="telefone" class="form-label fw-bold">Telefone</label>
          <input type="tel" id="telefone" class="form-control form-control-lg" required placeholder="(11) 98888-7777">
        </div>

        <div class="mb-4">
          <label for="restricao" class="form-label fw-bold">Restrição Alimentar?</label>
          <select id="restricao" class="form-select form-select-lg">
            <option value="Nenhuma">Nenhuma</option>
            <option value="Intolerância à lactose">Intolerância à lactose</option>
            <option value="Celíaco / Sem Glúten">Celíaco / Sem Glúten</option>
            <option value="Vegetariano">Vegetariano</option>
            <option value="Outra">Outra</option>
          </select>
        </div>

        <button type="submit" class="btn btn-success w-100 btn-acessivel fw-bold">Garantir Vaga</button>
      </form>
    </div>

    <!-- Modal/Sucesso com QR Code -->
    <div id="qr-container" class="card shadow-sm p-4 rounded-3 text-center d-none">
      <h4 class="text-success fw-bold">Inscrição Confirmada!</h4>
      <p class="text-muted">Apresente este QR Code na portaria do evento:</p>
      <div id="qrcode" class="d-flex justify-content-center my-3"></div>
      <p id="token-texto" class="badge bg-secondary fs-6"></p>
      <button onclick="window.location.reload()" class="btn btn-outline-secondary w-100 btn-acessivel mt-3">Nova Inscrição</button>
    </div>

    <!-- Link Acesso Restrito -->
    <div class="text-center mt-4">
      <a href="/portaria.html" class="text-muted small text-decoration-underline">Acesso Restrito (Voluntários)</a>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
